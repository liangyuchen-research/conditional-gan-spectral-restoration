name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "numpy<2" "pandas>=1.5,<3" "scipy>=1.9,<2" "matplotlib>=3.6,<4" "scikit-learn>=1.2,<2" "nbformat>=5,<6"
      - run: python scripts/check_calibration.py
      - run: python scripts/make_figures.py
